name: Update and Check Nix Flake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Update flake inputs
        run: nix flake update

      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # flake check only evaluates; build the servers so a broken update never gets committed
      # (desktop is skipped: without the CachyOS binary cache it would compile a kernel)
      - name: Build server configurations
        run: |
          for host in media services; do
            nix build --impure --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      # On the native runner, the credentials actions/checkout persists aren't picked up
      # (probably its includeIf gitdir rule vs. the DynamicUser state dir's symlinked path),
      # so hand the token to this push directly
      #
      # The branch protection of main blocks a direct push, so the bot pushes its
      # own branch and offers the update as a pull request; the owner merges it
      # (issue #372). The bot owns the branch alone, so it force-pushes the new
      # commit of each night onto it.
      - name: Commit, push, and open pull request
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if ! git diff --quiet; then
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.forgejo.com"
            git add flake.lock
            git commit -m "chore: update flake inputs"
            git -c credential.helper= \
              -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$FORGEJO_TOKEN"; }; f' \
              push --force origin HEAD:refs/heads/bot/update-flake
            # The pull request goes through the forge API. The token and the JSON
            # content type reach curl through a header file, so no process list
            # shows the token. The forge answers 422 for a wrong request and for
            # a pull request that exists already, so the step reads the answer
            # body: an existing pull request passes, each other answer fails with
            # the body printed.
            headers=$(mktemp)
            body=$(mktemp)
            answer=$(mktemp)
            trap 'rm -f "$headers" "$body" "$answer"' EXIT
            printf 'Authorization: token %s\nContent-Type: application/json\n' "$FORGEJO_TOKEN" > "$headers"
            printf '{"head":"bot/update-flake","base":"main","title":"chore: update flake inputs","body":"Nightly flake input update from the schedule of update-flake.yaml. The owner merges."}' > "$body"
            code=$(curl -sS -H @"$headers" -X POST "${{ github.api_url }}/repos/${{ github.repository }}/pulls" \
              --data @"$body" -o "$answer" -w '%{http_code}')
            answer_text=$(cat "$answer")
            exists=no
            case "$answer_text" in *"already exist"*) exists=yes;; esac
            if [ "$code" = 201 ]; then
              echo "pull request opened for bot/update-flake"
            elif [ "$code" = 409 ] || [ "$exists" = yes ]; then
              echo "an open pull request for bot/update-flake exists; the push updated it"
            else
              echo "pull request create failed with status $code"
              cat "$answer"
              echo "open it by hand: ${{ github.serverUrl }}/${{ github.repository }}/compare/main...bot/update-flake"
              exit 1
            fi
          else
            echo "No changes to commit"
          fi
