name: Update and Check Nix Flake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Update flake inputs
        run: nix flake update

      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill nixos root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # flake check only evaluates; build the servers so a broken update never gets committed
      # (desktop is skipped: without the CachyOS binary cache it would compile a kernel)
      - name: Build server configurations
        run: |
          for host in media services; do
            nix build --impure --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      # On the native runner, the credentials actions/checkout persists aren't picked up
      # (probably its includeIf gitdir rule vs. the DynamicUser state dir's symlinked path),
      # so hand the token to this push directly
      - name: Commit and push changes
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if ! git diff --quiet; then
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.forgejo.com"
            git add flake.lock
            git commit -m "chore: update flake inputs"
            git -c credential.helper= \
              -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$FORGEJO_TOKEN"; }; f' \
              push
          else
            echo "No changes to commit"
          fi
