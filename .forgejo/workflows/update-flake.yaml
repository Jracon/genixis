name: Update and Check Nix Flake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Update flake inputs
        run: nix flake update

      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # flake check only evaluates; build the servers so a broken update never gets committed
      # (desktop is skipped: without the CachyOS binary cache it would compile a kernel)
      - name: Build server configurations
        run: |
          for host in media services; do
            nix build --impure --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      # On the native runner, the credentials actions/checkout persists aren't picked up
      # (probably its includeIf gitdir rule vs. the DynamicUser state dir's symlinked path),
      # so hand the token to this push directly
      #
      # The push needs a real login. The automatic job token authenticates as
      # the internal forgejo-actions account, which holds no database row, so
      # the branch protection faults while it loads the pusher and the forge
      # answers an internal error (issue #474). The fault hits every shape of
      # the protection, with the push whitelist on and off. The Actions secret
      # CLAUDE_BOT_TOKEN holds a claude-bot token with write scope on this
      # repository, and the push whitelist of main names claude-bot, so the
      # push passes protection and lands without a pull request. The step
      # stages flake.lock alone, so the commit stays a lock-only commit. The
      # push is plain, never a force push: a main that moved during the run
      # rejects it, the run fails, and the next night retries.
      - name: Commit and push to main
        env:
          CLAUDE_BOT_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
        run: |
          if ! git diff --quiet; then
            if [ -z "$CLAUDE_BOT_TOKEN" ]; then
              echo "the forge holds no Actions secret CLAUDE_BOT_TOKEN; add it, or the nightly cannot land (issue #474)"
              exit 1
            fi
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.forgejo.com"
            git add flake.lock
            git commit -m "chore: update flake inputs"
            git -c credential.helper= \
              -c credential.helper='!f() { echo username=claude-bot; echo "password=$CLAUDE_BOT_TOKEN"; }; f' \
              push origin HEAD:refs/heads/main
          else
            echo "No changes to commit"
          fi
