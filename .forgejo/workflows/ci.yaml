name: Pull request gate

# same-repository pull requests run the workflows from the pull request content,
# so this file also runs for the pull request that adds it. The reports job runs
# on the schedule and on a manual dispatch, never on a pull request.
on:
  pull_request:
  schedule:
    # 03:41 UTC daily, off the midnight input update, so the reports never
    # overlap the update run
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      # flake check builds the checks of the local system: on the runner,
      # checks.x86_64-linux.project, whose checkPhase runs gofmt -l and
      # go test of the project tool (lib/project-package.nix)
      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # documentation rules: a cited docs path must resolve, every file of
      # docs/ and every README under modules/ must be listed in AGENTS.md,
      # every record file of docs/adr/ must be named in the register index
      # of docs/decisions.md, a citation carries no line number, and each
      # sub-list item is lettered. The record files of docs/adr/ are exempt
      # as sources: each record is append-only and cites historical paths.
      # The writing rules exempt the register surfaces, the index and the
      # record files, because register text is append-only
      # (docs/adr/deep-homes-of-subsumed-products.md and
      # docs/adr/gate-writing-rules.md). The sweep runs as the docs check
      # of lib/checks.nix on the flake source, so it needs no git of the
      # runner
      - name: Check documentation rules
        run: nix build .#checks.x86_64-linux.docs --no-link

      - name: Test the forge hook
        run: python3 modules/programs/cli/claude/forge-hook-test.py

      - name: Test the dispatcher
        run: python3 modules/services/dispatcher/dispatcher-test.py

      - name: Lint the Nix files
        run: nix build .#checks.x86_64-linux.deadnix .#checks.x86_64-linux.statix --no-link

      - name: Vet the Go module
        run: nix build .#checks.x86_64-linux.go-vet --no-link

      - name: Staticcheck the Go module
        run: nix build .#checks.x86_64-linux.staticcheck --no-link

      - name: Lint the Python harnesses
        run: nix build .#checks.x86_64-linux.ruff --no-link

      - name: Lint the nvim lua files
        run: nix build .#checks.x86_64-linux.luacheck --no-link

      - name: Scan the tree for secrets
        run: nix build .#checks.x86_64-linux.secrets --no-link

  reports:
    if: github.event_name != 'pull_request'
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Report Go vulnerabilities
        run: |
          cd modules/programs/cli/project
          nix run "$GITHUB_WORKSPACE#packages.x86_64-linux.govulncheck" -- ./...

      - name: Report the age of the flake inputs
        run: |
          report=$(nix build .#checks.x86_64-linux.input-age --no-link --print-out-paths)
          cat "$report"

      - name: Scan the pinned container images for CVEs
        run: |
          images=$(nix build .#checks.x86_64-linux.pinned-images --no-link --print-out-paths)
          while read -r image; do
            echo "== $image"
            nix run .#trivy -- image --scanners vuln --quiet "$image" || true
          done < "$images"
