name: Pull request gate

# same-repository pull requests run the workflows from the pull request content,
# so this file also runs for the pull request that adds it. The reports job and
# the sweep job run on their schedules and on a manual dispatch, never on a
# pull request.
on:
  pull_request:
  schedule:
    # 03:41 UTC daily, off the midnight input update, so the reports never
    # overlap the update run
    - cron: "41 3 * * *"
    # 05:41 UTC each Monday, off the daily reports window, so the entity
    # sweep never overlaps the reports run (issue 392)
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      tracker:
        description: "Issue number that receives the sweep report comment"

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      # flake check builds the checks of the local system: on the runner,
      # checks.x86_64-linux.project, whose checkPhase runs gofmt -l and
      # go test of the project tool (lib/project-package.nix)
      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # documentation rules: a cited docs path must resolve, every file of
      # docs/ and every README under modules/ must be listed in AGENTS.md,
      # every record file of docs/adr/ must be named in the register index
      # of docs/decisions.md, a citation carries no line number, and each
      # sub-list item is lettered. The record files of docs/adr/ are exempt
      # as sources: each record is append-only and cites historical paths.
      # The writing rules exempt the register surfaces, the index and the
      # record files, because register text is append-only
      # (docs/adr/deep-homes-of-subsumed-products.md and
      # docs/adr/gate-writing-rules.md). The sweep runs as the docs check
      # of lib/checks.nix on the flake source, so it needs no git of the
      # runner
      - name: Check documentation rules
        run: nix build .#checks.x86_64-linux.docs --no-link

      - name: Test the forge hook
        run: python3 modules/programs/cli/claude/forge-hook-test.py

      - name: Test the dispatcher
        run: python3 modules/services/dispatcher/dispatcher-test.py

      - name: Lint the Nix files
        run: nix build .#checks.x86_64-linux.deadnix .#checks.x86_64-linux.statix --no-link

      - name: Vet the Go module
        run: nix build .#checks.x86_64-linux.go-vet --no-link

      - name: Staticcheck the Go module
        run: nix build .#checks.x86_64-linux.staticcheck --no-link

      - name: Lint the Python harnesses
        run: nix build .#checks.x86_64-linux.ruff --no-link

      - name: Lint the nvim lua files
        run: nix build .#checks.x86_64-linux.luacheck --no-link

      - name: Scan the tree for secrets
        run: nix build .#checks.x86_64-linux.secrets --no-link

      - name: Gate the port claims
        run: nix build .#checks.x86_64-linux.port-claims --no-link

      - name: Gate the playlist generator fixture
        run: nix build .#checks.x86_64-linux.playlist-fixture --no-link

      - name: Gate the backup script fixtures
        run: nix build .#checks.x86_64-linux.backup-scripts-fixture --no-link

      - name: Check the bash scripts
        run: nix build .#checks.x86_64-linux.shfmt .#checks.x86_64-linux.shellcheck --no-link

      - name: Check the lua formatting
        run: nix build .#checks.x86_64-linux.stylua --no-link

      - name: Check the python formatting
        run: nix build .#checks.x86_64-linux.ruff-format --no-link

      - name: Type-check the python harnesses
        run: nix build .#checks.x86_64-linux.basedpyright --no-link

      - name: Check the yaml files
        run: nix build .#checks.x86_64-linux.yamllint .#checks.x86_64-linux.prettier --no-link

      - name: Check the workflow structure
        run: nix build .#checks.x86_64-linux.actionlint --no-link

      - name: Check the Caddyfile
        run: nix build .#checks.x86_64-linux.caddy --no-link

      - name: Gate the commit subject fixture
        run: nix build .#checks.x86_64-linux.commit-subjects-fixture --no-link

      - name: Find the dead python code
        run: nix build .#checks.x86_64-linux.vulture --no-link

      - name: Sweep the tree for misspellings
        run: nix build .#checks.x86_64-linux.codespell --no-link

      # brief non-conformance, class 4 of the seed set (issue 392): the
      # event payload carries the pull request body, so the check needs no
      # API call and no secret; the dispatcher reads the same payload shape
      # (modules/services/dispatcher/dispatcher.py). A body created after
      # 2026-11-09 must hold each section of the pull request template, and
      # the template comes from the checkout, so a template change gates
      # its own pull request
      - name: Check the pull request brief
        run: python3 .forgejo/scripts/entity-sweep.py brief

  reports:
    if: github.event_name != 'pull_request' && github.event.schedule != '41 5 * * 1'
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Report Go vulnerabilities
        run: |
          cd modules/programs/cli/project
          nix run "$GITHUB_WORKSPACE#packages.x86_64-linux.govulncheck" -- ./...

      - name: Report the age of the flake inputs
        run: |
          report=$(nix build .#checks.x86_64-linux.input-age --no-link --print-out-paths)
          cat "$report"

      - name: Scan the pinned container images for CVEs
        run: |
          images=$(nix build .#checks.x86_64-linux.pinned-images --no-link --print-out-paths)
          while read -r image; do
            echo "== $image"
            nix run .#trivy -- image --scanners vuln --quiet "$image" || true
          done < "$images"

      - name: Report duplicate sentences of the documentation tree
        run: |
          report=$(nix build .#checks.x86_64-linux.doc-duplicates --no-link --print-out-paths)
          cat "$report"

      # the performance protocol of the audit (issue 366, pass A5): the
      # commands come from the baseline file, so the file and the report
      # cannot drift apart
      - name: Report the performance baseline
        run: |
          baseline=.forgejo/perf-baseline.json
          jq -r '.commands | keys[]' "$baseline" | while read -r command; do
            for run in 1 2 3; do
              start=$(date +%s%N)
              eval "$command" > /dev/null
              end=$(date +%s%N)
              echo "$command $(( (end - start) / 1000000000 ))"
            done
          done | sort | awk '
              { cmd = $1; for (i = 2; i < NF; i++) cmd = cmd " " $i
                n[cmd]++; if (n[cmd] == 2) med[cmd] = $NF }
              END { for (c in med) printf "%s  median %ss\n", c, med[c] }'
          echo "-- baseline, recorded $(jq -r .recorded "$baseline") on $(jq -r .host "$baseline") by $(jq -r .method "$baseline"):"
          jq -r '.commands | to_entries[] | "\(.key): median \(.value.median_seconds)s"' "$baseline"

  # the entity text sweep of the forge, classes 1 to 3 of the seed set
  # (issue 392): the weekly cron sits off the daily reports window, and the
  # event payload names the cron that fired, so the job tells its own
  # schedule from the daily one. The sweep reads the corpus through the API
  # with the ENTITY_SWEEP_TOKEN secret of the dedicated login, prints the
  # report to the run log, and posts one comment on the tracker issue. It
  # edits no entity. The findings never fail the run; a transport fault
  # fails it. A manual dispatch runs the sweep too: the dry run of
  # criterion 3 is a dispatch with the tracker input set to issue 392
  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 1'
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Sweep the forge entity text
        env:
          ENTITY_SWEEP_TOKEN: ${{ secrets.ENTITY_SWEEP_TOKEN }}
          SWEEP_TRACKER: ${{ inputs.tracker || '572' }}
        run: python3 .forgejo/scripts/entity-sweep.py report
