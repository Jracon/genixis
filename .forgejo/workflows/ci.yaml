name: Pull request gate

# same-repository pull requests run the workflows from the pull request content,
# so this file also runs for the pull request that adds it
on:
  pull_request:

jobs:
  gate:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      # flake check builds the checks of the local system: on the runner,
      # checks.x86_64-linux.project, whose checkPhase runs gofmt -l and
      # go test of the project tool (lib/project-package.nix)
      - name: Check flake
        run: nix flake check --impure

      # flake check skips darwinConfigurations and homeConfigurations entirely
      - name: Evaluate Darwin and Home Manager configurations
        run: |
          nix eval --raw .#darwinConfigurations.m2pro-mbp.system.drvPath
          for user in jademeskill nixos root; do
            nix eval --impure --raw ".#homeConfigurations.$user.activationPackage.drvPath"
          done

      # documentation paths: a cited docs path must resolve, every file
      # of docs/ and every README under modules/ must be listed in AGENTS.md,
      # and every record file of docs/adr/ must be named in the register
      # index (docs/decisions.md). The record files of docs/adr/ are exempt
      # as sources of citations: each record is append-only and names
      # historical paths. The README sweep names the deep homes of
      # subsumed products (docs/adr/deep-homes-of-subsumed-products.md).
      # git grep binds to tracked files and takes the exemption as a
      # pathspec, so the sweep needs no grep exclude flags (run 654: the
      # --exclude flag of the runner grep did not keep the register out)
      - name: Check documentation paths
        run: |
          set -eu
          missing=0
          for p in $(git grep -hoE 'docs/([a-z0-9-]+/)?[a-z0-9-]+\.md' \
              -- '*.nix' '*.go' '*.py' '*.md' ':(exclude)docs/adr' \
              | sort -u); do
            test -f "$p" || { echo "missing: $p"; missing=1; }
          done
          for f in docs/*.md; do
            grep -q "$f" AGENTS.md || { echo "unlisted: $f"; missing=1; }
          done
          for f in docs/adr/*.md; do
            grep -q "$f" docs/decisions.md || { echo "unindexed: $f"; missing=1; }
          done
          for f in $(git ls-files 'modules/**/README.md'); do
            grep -q "$f" AGENTS.md || { echo "unlisted: $f"; missing=1; }
          done
          test "$missing" -eq 0

      - name: Test the forge hook
        run: python3 modules/programs/cli/claude/forge-hook-test.py

      - name: Test the dispatcher
        run: python3 modules/services/dispatcher/dispatcher-test.py
