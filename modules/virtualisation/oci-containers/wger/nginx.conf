# Adapted from config/nginx.conf of wger-project/docker: the PowerSync upstream
# and the /ps/ location are absent, because mobile sync is deferred (see the
# wger entry in docs/containers.md). Caddy terminates TLS in front of this
# server and sets X-Forwarded-Proto; the map passes that value on to the app,
# with a fallback for a direct connection to this port.

upstream wger {
    server wger:8000;
}

map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    access_log /dev/stdout;

    location / {
        proxy_pass http://wger;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_http_version 1.1;

        # Timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The static files come from collectstatic, so their names hold a hash and
    # a long cache time is safe
    location /static/ {
        alias /wger/static/;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /wger/media/;
    }

    # Video uploads need a large body size
    client_max_body_size 100M;
}
